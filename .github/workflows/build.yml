name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      # build-installer.ps1 builds the plugin again (a no-op here) and writes
      # dist\YtAudioBrowser-Setup.exe (tools bundled) or ...-Slim.exe (-Slim).
      - name: Build installers
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 -Slim
          ./scripts/build-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: YtAudioBrowser-plugin
          path: build/Release/YtAudioBrowser.clap

      - uses: actions/upload-artifact@v4
        with:
          name: YtAudioBrowser-installers
          path: dist/*.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libgtk-3-dev libcurl4-openssl-dev

      - name: Build plugin
        run: |
          cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux -j

      - name: Package (tar.gz and .deb)
        run: bash scripts/linux/build-packages.sh

      - uses: actions/upload-artifact@v4
        with:
          name: YtAudioBrowser-linux
          path: |
            dist/*.tar.gz
            dist/*.deb
